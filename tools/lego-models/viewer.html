stage.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color("#e9e6e0");
const camera = new THREE.PerspectiveCamera(35, 1, 10, 20000);
const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.autoRotate = true; controls.autoRotateSpeed = 0.8;
controls.maxPolarAngle = Math.PI * 0.62;

scene.add(new THREE.HemisphereLight(0xffffff, 0x9d968c, 0.6));
const key = new THREE.DirectionalLight(0xfff4e6, 1.5);
key.castShadow = true; key.shadow.mapSize.set(2048, 2048); key.shadow.bias = -0.0005;
scene.add(key); scene.add(key.target);
const fill = new THREE.DirectionalLight(0xe6f0ff, 0.3); scene.add(fill);

const ground = new THREE.Mesh(new THREE.PlaneGeometry(20000, 20000), new THREE.ShadowMaterial({ opacity: 0.18 }));
ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);

// brick geometry (mm), origin at the brick's bottom centre; x is the long side
function brickGeometry(nx, ny) {
  const L = nx * 8 - 0.2, W = ny * 8 - 0.2, H = LAYER;
  const parts = [];
  const body = new THREE.BoxGeometry(L, H, W); body.translate(0, H / 2, 0); parts.push(body);
  for (let a = 0; a < nx; a++) for (let b = 0; b < ny; b++) {
    const s = new THREE.CylinderGeometry(2.4, 2.4, 1.7, 14, 1, false); s.translate((a - (nx - 1) / 2) * 8, H + 0.85, (b - (ny - 1) / 2) * 8);
    parts.push(s);
  }
  const g = THREE.BufferGeometryUtils.mergeBufferGeometries(parts.map(p => p.toNonIndexed()));
  g.computeVertexNormals();
  return g;
}
const GEO4 = brickGeometry(4, 2), GEO2 = brickGeometry(2, 2);
const material = new THREE.MeshStandardMaterial({ roughness: 0.35, metalness: 0.0 });

let current = null;
function build(name) {
  if (current) { current.meshes.forEach(m => { scene.remove(m); m.dispose && m.dispose(); }); }
  const d = DATA[name], flat = d.bricks, n = flat.length / 5;
  const recs = [];
  let maxK = 0, sx = 0, sz = 0;
  for (let t = 0; t < n; t++) {
    const i = flat[5 * t], j = flat[5 * t + 1], k = flat[5 * t + 2], o = flat[5 * t + 3], c = flat[5 * t + 4];
    const x = o === 0 ? (i + 1) * CELL : (i + 0.5) * CELL;
    const y = o === 1 ? (j + 1) * CELL : (j + 0.5) * CELL;
    recs.push({ x, y, k, o, c }); maxK = Math.max(maxK, k); sx += x; sz += y;
  }
  const cx = sx / n, cz = sz / n;
  recs.sort((a, b) => a.k - b.k);
  const groups = [recs.filter(r => r.o !== 2), recs.filter(r => r.o === 2)];
  const meshes = groups.map((g, gi) => {
    const mesh = new THREE.InstancedMesh(gi === 0 ? GEO4 : GEO2, material, g.length);
    const m = new THREE.Matrix4(), q = new THREE.Quaternion(), up = new THREE.Vector3(0, 1, 0), one = new THREE.Vector3(1, 1, 1);
    const col = new THREE.Color();
    g.forEach((r, idx) => {
      q.setFromAxisAngle(up, r.o === 1 ? Math.PI / 2 : 0);
      // model (x, y, z-up) -> three (x, z-up as y, -y as z)
      m.compose(new THREE.Vector3(r.x - cx, r.k * LAYER, -(r.y - cz)), q, one);
      mesh.setMatrixAt(idx, m);
      col.set(d.palette[r.c]).convertSRGBToLinear();
      const v = 0.93 + 0.1 * (((r.x * 73856093) ^ (r.y * 19349663) ^ (r.k * 83492791)) >>> 0) / 4294967295;  // stable per-brick shade
      col.multiplyScalar(v);
      mesh.setColorAt(idx, col);
    });
    mesh.castShadow = true; mesh.receiveShadow = true;
    mesh.userData.layers = g.map(r => r.k);
    scene.add(mesh);
    return mesh;
  });
  // fit camera and light to the model
  const box = new THREE.Box3(); meshes.forEach(mm => { mm.computeBoundingBox && mm.computeBoundingBox(); });
  let minX = Infinity, maxX = -Infinity, minZ = Infinity, maxZ = -Infinity;
  recs.forEach(r => { minX = Math.min(minX, r.x - cx); maxX = Math.max(maxX, r.x - cx); minZ = Math.min(minZ, -(r.y - cz)); maxZ = Math.max(maxZ, -(r.y - cz)); });
  const height = (maxK + 1) * LAYER, span = Math.max(maxX - minX, maxZ - minZ, height);
  let rad = 0; recs.forEach(r => { const dx = r.x - cx, dy = r.k * LAYER - height * 0.45, dz = r.y - cz; rad = Math.max(rad, Math.hypot(dx, dy, dz)); });
  current = { name, meshes, maxK, span, height, n, rad: rad + 20, view: d.view };
  key.position.set(span * 0.9, span * 1.6, span * 0.7); key.target.position.set(0, height * 0.4, 0);
  const sc = key.shadow.camera; sc.left = -span; sc.right = span; sc.top = span; sc.bottom = -span; sc.near = 10; sc.far = span * 5; sc.updateProjectionMatrix();
  fill.position.set(-span, span * 0.6, -span * 0.4);
  const slider = document.getElementById("layer"); slider.max = maxK + 1; slider.value = maxK + 1;
  document.getElementById("legend").innerHTML = d.palette.map((p, ci) => `<span><span class="sw" style="background:${p}"></span>${d.names[ci]}</span>`).join("");
  resetView(); setLayer(maxK + 1);
  document.getElementById("m-mobius").setAttribute("aria-pressed", name === "mobius");
  document.getElementById("m-trefoil").setAttribute("aria-pressed", name === "trefoil");
}
function setLayer(L) {
  let shown = 0;
  current.meshes.forEach(mesh => {
    const ks = mesh.userData.layers; let c = 0;
    while (c < ks.length && ks[c] < L) c++;
    mesh.count = c; shown += c;
  });
  document.getElementById("readout").textContent = `layer ${L} of ${current.maxK + 1} · ${shown.toLocaleString()} of ${current.n.toLocaleString()} bricks`;
}
function resetView() {
  // same angle as the final render; distance so the whole model fits on this screen
  const v = new THREE.Vector3(...current.view).normalize();
  const vfov = camera.fov * Math.PI / 180, hfov = 2 * Math.atan(Math.tan(vfov / 2) * camera.aspect);
  const dist = current.rad / Math.sin(Math.min(vfov, hfov) / 2) * (camera.aspect < 1 ? 1.02 : 0.92);
  controls.target.set(0, current.height * 0.45, 0);
  camera.position.copy(controls.target).addScaledVector(v, dist);
  camera.near = dist / 50; camera.far = dist * 20; camera.updateProjectionMatrix();
  controls.update();
}
function resize() {
  const w = stage.clientWidth, h = stage.clientHeight;
  renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix();
}
window.addEventListener("resize", resize);
document.getElementById("layer").addEventListener("input", e => setLayer(+e.target.value));
document.getElementById("m-mobius").onclick = () => { build("mobius"); history.replaceState(null, "", "#mobius"); };
document.getElementById("m-trefoil").onclick = () => { build("trefoil"); history.replaceState(null, "", "#trefoil"); };
document.getElementById("reset").onclick = resetView;
document.getElementById("spin").onclick = e => { controls.autoRotate = !controls.autoRotate; e.target.setAttribute("aria-pressed", controls.autoRotate); };
renderer.domElement.addEventListener("pointerdown", () => { document.getElementById("hint").style.opacity = 0; }, { once: true });
resize(); build(location.hash === "#mobius" ? "mobius" : "trefoil");
let frames = 0;
(function loop() { controls.update(); renderer.render(scene, camera); frames++; if (!(window.__STATIC && frames > 2)) requestAnimationFrame(loop); })();
</script>
</body>
</html>
