<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Shortest matching never crosses</title>
<style>
  :root {
    --ink: #2b2622;
    --paper: #ffffff;
    --chrome: #faf7f2;
    --blue: #3566c9;
    --red: #d4483e;
    --seg: #6b6259;
    --accent: #b98a2f;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; }
  body {
    font-family: ui-rounded, "SF Pro Rounded", "Segoe UI", system-ui, sans-serif;
    color: var(--ink);
    background: var(--paper);
    display: flex;
    flex-direction: column;
  }
  header {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 10px 14px;
    background: var(--chrome);
    border-bottom: 1px solid #e8e1d6;
    flex-wrap: wrap;
  }
  .n-control {
    display: flex;
    align-items: center;
    gap: 6px;
    background: #fff;
    border: 1.5px solid #d8cfc0;
    border-radius: 999px;
    padding: 4px 6px;
  }
  .n-control button {
    width: 34px; height: 34px;
    border: none;
    border-radius: 999px;
    background: transparent;
    font-size: 20px;
    font-weight: 700;
    color: var(--ink);
    cursor: pointer;
    line-height: 1;
    touch-action: manipulation;
  }
  .n-control button:hover:not(:disabled) { background: #f1e9db; }
  .n-control button:disabled { color: #c9c0b2; cursor: default; }
  .n-control button:focus-visible { outline: 2px solid var(--accent); }
  .n-value {
    min-width: 52px;
    text-align: center;
    font-variant-numeric: tabular-nums;
    font-weight: 700;
    font-size: 17px;
  }
  .n-value small { font-weight: 500; color: #8a8073; }
  .title {
    font-size: 14px;
    color: #6f6659;
    line-height: 1.25;
  }
  .title b { color: var(--ink); }
  @media (max-width: 480px) {
    .title { font-size: 12.5px; flex: 1 1 100%; order: 2; }
  }
  #stage {
    flex: 1;
    position: relative;
    background: var(--paper);
  }
  canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    touch-action: none;   /* we handle all dragging ourselves */
    cursor: grab;
  }
  canvas.dragging { cursor: grabbing; }
  @media (prefers-reduced-motion: reduce) {
    /* the pairing-change pulse is skipped via JS flag */
  }
</style>
</head>
<body>
<header>
  <div class="n-control" aria-label="Number of points per color">
    <button id="dec" aria-label="Fewer points">−</button>
    <div class="n-value"><small>n&nbsp;=</small> <span id="nval">4</span></div>
    <button id="inc" aria-label="More points">+</button>
  </div>
  <div class="title">
    <b>Drag the dots.</b> The shortest blue–red pairing is drawn live —
    it may switch, but it never crosses itself.
  </div>
</header>
<div id="stage"><canvas id="cv"></canvas></div>

<script>
(() => {
  const MIN_N = 2, MAX_N = 10;
  const cv = document.getElementById('cv');
  const ctx = cv.getContext('2d');
  const stage = document.getElementById('stage');
  const nval = document.getElementById('nval');
  const decBtn = document.getElementById('dec');
  const incBtn = document.getElementById('inc');
  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

  let n = 4;
  // Points stored in normalized [0,1] x [0,1] coords so resizing is graceful.
  let blues = [], reds = [];
  let pairing = [];            // pairing[i] = index of red matched to blue i
  let lastSig = '';
  let flashT = 0;              // time (ms) when a pairing change happened
  let W = 0, H = 0, DPR = 1;

  const rand = (a, b) => a + Math.random() * (b - a);
  function randomPoint() { return { x: rand(0.12, 0.88), y: rand(0.12, 0.88) }; }

  function setN(newN) {
    n = Math.max(MIN_N, Math.min(MAX_N, newN));
    while (blues.length < n) blues.push(randomPoint());
    while (reds.length  < n) reds.push(randomPoint());
    blues.length = n; reds.length = n;
    nval.textContent = n;
    decBtn.disabled = n <= MIN_N;
    incBtn.disabled = n >= MAX_N;
    computePairing();
    draw();
  }

  // ---- Minimum-cost perfect matching via bitmask DP: O(n^2 * 2^n) ----
  function computePairing() {
    if (blues.length < n || reds.length < n) { pairing = []; return; }
    const size = 1 << n;
    const dist = [];
    for (let i = 0; i < n; i++) {
      dist.push([]);
      for (let j = 0; j < n; j++) {
        const dx = (blues[i].x - reds[j].x) * W;
        const dy = (blues[i].y - reds[j].y) * H;
        dist[i][j] = Math.hypot(dx, dy);
      }
    }
    const dp = new Float64Array(size).fill(Infinity);
    const choice = new Int8Array(size).fill(-1);
    dp[0] = 0;
    for (let mask = 0; mask < size; mask++) {
      if (dp[mask] === Infinity) continue;
      // number of reds used = number of blues already matched
      let i = 0, m = mask;
      while (m) { i += m & 1; m >>= 1; }
      if (i === n) continue;
      for (let j = 0; j < n; j++) {
        if (mask & (1 << j)) continue;
        const nm = mask | (1 << j);
        const c = dp[mask] + dist[i][j];
        if (c < dp[nm] - 1e-12) { dp[nm] = c; choice[nm] = j; }
      }
    }
    // Reconstruct
    const pair = new Array(n);
    let mask = size - 1;
    for (let i = n - 1; i >= 0; i--) {
      const j = choice[mask];
      pair[i] = j;
      mask ^= (1 << j);
    }
    const sig = pair.join(',');
    if (sig !== lastSig && lastSig !== '') flashT = performance.now();
    lastSig = sig;
    pairing = pair;
  }

  // ---- Drawing ----
  function draw() {
    ctx.clearRect(0, 0, W, H);
    const now = performance.now();
    const flash = reduceMotion ? 0 : Math.max(0, 1 - (now - flashT) / 350);

    // segments
    ctx.lineCap = 'round';
    for (let i = 0; i < (pairing.length === n ? n : 0); i++) {
      const b = blues[i], r = reds[pairing[i]];
      ctx.beginPath();
      ctx.moveTo(b.x * W, b.y * H);
      ctx.lineTo(r.x * W, r.y * H);
      if (flash > 0) {
        ctx.strokeStyle = 'rgba(185,138,47,' + (0.35 + 0.65 * flash) + ')';
        ctx.lineWidth = 2.5 + 3 * flash;
      } else {
        ctx.strokeStyle = getComputedStyle(document.body).getPropertyValue('--seg');
        ctx.lineWidth = 2.5;
      }
      ctx.stroke();
    }

    // points
    const R = pointRadius();
    for (const [pts, color] of [[blues, cssVar('--blue')], [reds, cssVar('--red')]]) {
      for (const p of pts) {
        ctx.beginPath();
        ctx.arc(p.x * W, p.y * H, R, 0, Math.PI * 2);
        ctx.fillStyle = color;
        ctx.fill();
        ctx.lineWidth = 2.5;
        ctx.strokeStyle = '#ffffff';
        ctx.stroke();
      }
    }

    if (flash > 0) requestAnimationFrame(draw);
  }
  function cssVar(name) { return getComputedStyle(document.body).getPropertyValue(name).trim(); }
  function pointRadius() { return Math.min(W, H) < 500 ? 11 : 9; }

  // ---- Resizing ----
  function resize() {
    DPR = window.devicePixelRatio || 1;
    const rect = stage.getBoundingClientRect();
    W = rect.width; H = rect.height;
    cv.width = Math.round(W * DPR);
    cv.height = Math.round(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    computePairing();
    draw();
  }
  window.addEventListener('resize', resize);

  // ---- Dragging (pointer events: mouse + touch + pen) ----
  let dragging = null; // {pts, idx}
  const GRAB = 34; // px hit radius

  function hitTest(x, y) {
    let best = null, bestD = GRAB;
    for (const pts of [blues, reds]) {
      for (let i = 0; i < pts.length; i++) {
        const d = Math.hypot(pts[i].x * W - x, pts[i].y * H - y);
        if (d < bestD) { bestD = d; best = { pts, idx: i }; }
      }
    }
    return best;
  }

  cv.addEventListener('pointerdown', e => {
    const rect = cv.getBoundingClientRect();
    const hit = hitTest(e.clientX - rect.left, e.clientY - rect.top);
    if (hit) {
      dragging = hit;
      cv.setPointerCapture(e.pointerId);
      cv.classList.add('dragging');
    }
  });
  cv.addEventListener('pointermove', e => {
    if (!dragging) return;
    const rect = cv.getBoundingClientRect();
    const m = pointRadius() + 2;
    dragging.pts[dragging.idx].x = Math.min(1 - m / W, Math.max(m / W, (e.clientX - rect.left) / W));
    dragging.pts[dragging.idx].y = Math.min(1 - m / H, Math.max(m / H, (e.clientY - rect.top) / H));
    computePairing();
    draw();
  });
  const endDrag = () => { dragging = null; cv.classList.remove('dragging'); };
  cv.addEventListener('pointerup', endDrag);
  cv.addEventListener('pointercancel', endDrag);

  // ---- Controls ----
  decBtn.addEventListener('click', () => setN(n - 1));
  incBtn.addEventListener('click', () => setN(n + 1));

  // ---- Go ----
  setN(4);   // populate points first —
  resize();  // — then measure the canvas and draw
})();
</script>
</body>
</html>
